<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Титан vs Codex vs Claude{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
<header class="top">
  <span class="brand">🎮 Титан vs Codex vs Claude</span>
  <a href="/">Scoreboard</a>
  <a href="/ui/markets">Матчи</a>
  <a href="/ui/exports">Экспорт</a>
  <a href="/docs">API</a>
  <span style="margin-left:auto"></span>
  <span class="pill">PAPER TRADING</span>
  <span class="pill warn">live: {{ 'ON' if live_trading else 'OFF' }}</span>
  <span class="muted" style="color:#9aa4b8">источник: {{ provider }}</span>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
